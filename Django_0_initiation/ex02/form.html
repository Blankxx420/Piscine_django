<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./popup.js"></script>
</head>
<body>
    <form>
        <label for="firstname">First Name:</label>
        <input type="text" id="firstname" name="Firstname" required><br>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="0" max="120" step="1" required><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br>

        <label for="student">Student at 42?</label>
        <input type="checkbox" id="student" name="student-42"><br>

        <label for="gender_male">Male</label>
        <input type="radio" id="gender_male" name="Gender" value="Male">

        <label for="gender_female">Female</label>
        <input type="radio" id="gender_female" name="Gender" value="Female">

        <label for="gender_other">Other</label>
        <input type="radio" id="gender_other" name="Gender" value="Other"><br>
        
        <input type="button" value="Submit" onclick="displayFormContents()">
    </form>
</body>
</html>

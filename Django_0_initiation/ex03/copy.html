<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <ul>
        <li class="frontend">
            <h2>Frontend</h2>
            <div>
                <span class="frontend">HTML5</span>
                <p data-value="80">
                    <progress class="html5" value="80" max="100"></progress>
                </p>
            </div>   
            <div>
                <span class="frontend">CSS3</span>
                <p data-value="60">
                    <progress class="css3" value="60" max="100"></progress>
                </p>
            </div>
            <div>
                <span class="frontend">jQuery</span>
                <p data-value="50">
                    <progress class="jquery" value="50" max="100"></progress>
                </p>
            </div>
        </li>
        
        <li class="backend">
            <h2>Backend</h2>
            <div>
                <span class="backend">Python</span>
                <p data-value="75">
                    <progress class="python" value="75" max="100"></progress>
                </p>
            </div>

            <div>
                <span class="backend">PHP</span>
                <p data-value="65">
                    <progress class="php" value="65" max="100"></progress>
                </p>
            </div>
            <div>
                <span class="backend">Node.js</span>
                <p data-value="35">
                    <progress class="node-js" value="35" max="100"></progress>
                </p>
            </div>
        </li>
    </ul>
</body>
</html>

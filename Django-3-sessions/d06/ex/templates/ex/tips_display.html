<h2 class="mb-4">Latest tips</h2>
        {% for tip in tips %}
            <div class="card mb-3 shadow-sm">
                <div class="card-body">
                    <p class="card-text">{{ tip.content }}</p>
                    <small class="text-muted">Par <strong>{{ tip.author }}</strong> le {{ tip.date_creation }}</small>
                    <a href="{% url 'upvote_tip' tip.id %}" class="btn btn-sm {% if request.user in tip.upvotes.all %}btn-success{% else %}btn-outline-success{% endif %} rounded-circle d-flex justify-content-center align-items-center" style="width: 38px; height: 38px;" title="Upvote">
    👍
</a>
                </div>
            </div>
        {% empty %}
            <p class="text-muted">No tips shared for the moment</p>
        {% endfor %}
